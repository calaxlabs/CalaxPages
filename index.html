<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="surface">

<header class="glass">
    <strong>GAMEVAULT</strong>

    <nav>
        <a href="#">Home</a>
        <a href="#games">Games</a>
        <a href="#downloads">Downloads</a>
    </nav>

    <button class="btn btn--glass">Profile</button>
</header>


<main>

    <section class="panel panel--xl">
        <span class="badge badge--accent">FEATURED</span>
        <h1>Project Aether</h1>
        <p class="text-muted">
            Explore a mysterious world and uncover its secrets.
        </p>
        <button class="btn btn--primary">Play Now</button>
        <button class="btn btn--glass">Learn More</button>
    </section>


    <section id="games">

        <h2>Games</h2>

        <div class="game-grid">

            <article class="panel">
                <img src="images/game1.jpg" alt="">
                <h3>Project Aether</h3>
                <p class="text-muted">Adventure · 42 GB</p>
                <button class="btn btn--primary">Play</button>
            </article>

            <article class="panel">
                <img src="images/game2.jpg" alt="">
                <h3>Neon Frontier</h3>
                <p class="text-muted">RPG · 67 GB</p>
                <button class="btn btn--glass">Download</button>
            </article>

            <article class="panel">
                <img src="images/game3.jpg" alt="">
                <h3>Void Protocol</h3>
                <p class="text-muted">Action · 31 GB</p>
                <button class="btn btn--glass">Download</button>
            </article>

            <article class="panel">
                <img src="images/game4.jpg" alt="">
                <h3>Frontier Zero</h3>
                <p class="text-muted">Survival · 54 GB</p>
                <button class="btn btn--glass">Download</button>
            </article>

        </div>

    </section>


    <section id="downloads" class="glass">

        <h2>Downloads</h2>

        <p>test</p>

        <div class="progress-bar">
            <div class="progress-bar__fill" style="width:37%"></div>
        </div>

        <p class="text-muted">1 / 67 GB</p>

    </section>

</main>


<style>
    header {
        display:flex;
        align-items:center;
        gap:30px;
        padding:18px 5%;
    }

    nav {
        display:flex;
        gap:25px;
        flex:1;
    }

    nav a {
        color:inherit;
        text-decoration:none;
    }

    main {
        max-width:1400px;
        margin:auto;
        padding:30px 5%;
    }

    section {
        margin-bottom:40px;
    }

    .game-grid {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:20px;
    }

    .game-grid img {
        width:100%;
        aspect-ratio:16/9;
        object-fit:cover;
        border-radius:10px;
    }
</style>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand"><span class="dot"></span>CalaxLabs</div>
    <div class="nav-links">
      <a class="active" href="index.html">View Games</a>
      <a href="favorited.html">Favorited</a>
      <a href="profile.html">Profile</a>
      <a href="about.html">About</a>
    </div>
    <div class="nav-spacer"></div>
  </nav>

  <main class="content">
    <div class="page-header">
      <h1>Your Library</h1>
      <p id="count-text">Loading games…</p>
    </div>
    <div class="game-grid" id="grid"></div>
  </main>

  <script src="script.js"></script>
  <script>
    (async () => {
      const grid = document.getElementById('grid');
      await renderGameGrid(grid);
      const games = await loadGames();
      document.getElementById('count-text').textContent = `${games.length} titles`;
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">CalaxLabs</a>      
    <nav class="nav">
        <a class="active" href="homepage.html">Homepage</a>
        <a href="games.html">Games</a>
        <a href="#">About</a>
        <a href="#">Community</a>
        <a href="#">Profile</a>
      </nav>
    <div class="user">[User Name]</div>
  </header>
  <main class="content">
    <section class="stats">
      <div class="stat-card">
        <span class="stat-label">Total Users Played</span>
        <span class="stat-value">1</span>
        <span class="stat-change positive">+0.0%</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Avg Ratings</span>
        <span class="stat-value">67/100</span>
        <span class="stat-change positive">+0.0%</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">temp</span>
        <span class="stat-value">0</span>
        <span class="stat-change">—</span>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="card-header">
          <h2>Latest Games</h2>
        </div>
        <div id="games-list"></div>
      </div>
    </section>

  </main>
  <script src="games.js"></script>
</body>
</html>
